<!doctype html>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9ebef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

  .phone {
    width: 390px;
    height: 844px;
    background: #f6f7f9;

    flex-direction: column;
    position: relative;
  }
  .statusbar {
    height: 26px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-weight: 600; background: #fff;
  }
  .header {
    height: 52px; background: #fff; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; border-bottom: 1px solid #eef0f3;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 10px;
    background: linear-gradient(135deg, #ff8a3d, #ff4d2e);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 12px;
  }
  .brand .title { font-size: 16px; font-weight: 700; line-height: 1.1; }
  .brand .sub { font-size: 10px; color: #9aa0a6; margin-top: 2px; }
  .header .cart {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: #f4f5f7; color: #4a4f55;
  }
  .scroll { flex: 1; overflow: hidden; padding: 12px 14px 6px; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #ff8a3d, #ff4d2e);
    color: #fff; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .bubble {
    background: #fff; border-radius: 4px 14px 14px 14px; padding: 10px 12px;
    font-size: 13px; line-height: 1.5; color: #2b2f33;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .profile {
    display: inline-flex; align-items: center; gap: 4px;
    margin: 7px 0 0 39px; font-size: 10.5px; color: #7a8088;
    background: #eef1f4; border-radius: 99px; padding: 4px 9px;
  }
  .profile b { color: #ff5a1f; font-weight: 600; }
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 13px 2px 7px; }
  .section-title h3 { font-size: 12.5px; margin: 0; color: #3a3f45; font-weight: 700; }
  .section-title span { font-size: 10.5px; color: #9aa0a6; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    background: #fff; border: 1px solid #e6e8ec; color: #3a3f45;
    font-size: 11.5px; padding: 6px 10px; border-radius: 99px; white-space: nowrap;
  }
  .chip.hot { border-color: #ffd2bd; color: #ff5a1f; background: #fff7f2; }
  .cats { display: flex; gap: 8px; }
  .cat {
    flex: 1; background: #fff; border-radius: 12px; padding: 7px 0;
    text-align: center; font-size: 11px; color: #4a4f55; border: 1px solid #eef0f3;
  }
  .cat b { display: block; font-size: 15px; margin-bottom: 2px; font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card .imgwrap { position: relative; height: 104px; background: #f2f3f5; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag {
    position: absolute; left: 7px; top: 7px; background: rgba(255,90,31,.92);
    color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 6px;
  }
  .card .info { padding: 8px 9px 9px; }
  .card .name { font-size: 11.5px; line-height: 1.35; color: #22262a; height: 31px; overflow: hidden; }
  .card .meta { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
  .price { color: #ff4d2e; font-weight: 700; font-size: 14px; }
  .price small { font-size: 9px; font-weight: 600; margin-right: 1px; }
  .sales { font-size: 9px; color: #a0a5ab; }
  .inputbar {
    background: #fff; border-top: 1px solid #eef0f3; padding: 8px 11px;
    display: flex; align-items: center; gap: 7px;
  }
  .iconbtn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: #6b7076; }
  .fakeinput {
    flex: 1; height: 36px; border-radius: 18px; background: #f2f4f6;
    display: flex; align-items: center; padding: 0 13px; font-size: 11.5px; color: #9aa0a6;
  }
  .send {
    width: 36px; height: 36px; border-radius: 50%; background: #ff5a1f;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .tabbar { height: 56px; background: #fff; border-top: 1px solid #eef0f3; display: flex; }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; font-size: 10px; color: #9aa0a6;
  }
  .tab.active { color: #ff5a1f; font-weight: 600; }
  .tab svg { width: 20px; height: 20px; }
</style>
</head>

  <div class="phone">
